<style>
:root {

  --panel-shadow:0 20px 80px rgba(0,0,0,.22); --glow:rgba(96,133,255,.12);
}
html[data-theme="gray"] {
  color-scheme: light;
  --bg:#a0a0a0; --bar:#787878; --bar-border:#b9b9b9;
  --surface:#b8b8b8; --surface-2:#c5c5c5; --stroke:#8b8b8b;
  --text:#191a1d; --muted:#35383d; --soft:#53565c;

}

::selection{background:var(--accent-strong);color:#fff}
.bg-orb{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:min(900px,120vw);height:600px;pointer-events:none;background:radial-gradient(ellipse at 50% 25%,var(--glow),transparent 67%);opacity:.8;z-index:0}
.site-shell{position:relative;isolation:isolate}
.top-wrap{position:sticky;top:13px;z-index:50;max-width:1440px;margin:22px auto 0;padding:0 22px}
.top-bar{display:flex;align-items:center;gap:24px;min-height:78px;padding:12px 24px;border-radius:16px;border:1px solid var(--bar-border);background:var(--bar);box-shadow:0 7px 35px rgba(0,0,0,.06);transition:background-color .34s,border-color .34s,box-shadow .34s;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:16px;font-weight:850;letter-spacing:-.055em}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--stroke);border-radius:10px;background:var(--surface)}.brand-mark svg{width:22px;height:22px;stroke:var(--text)}
.nav-links{display:flex;justify-content:center;align-items:center;gap:clamp(14px,2.8vw,40px);flex:1;white-space:nowrap}.nav-links a{position:relative;padding:12px 0;color:var(--muted);font-size:14px;font-weight:700;transition:color .2s}.nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--text)}.nav-links a::after{content:"";position:absolute;bottom:5px;left:0;width:100%;height:2px;border-radius:4px;background:var(--accent);transform:scaleX(0);transition:transform .23s;transform-origin:center}.nav-links a:hover::after,.nav-links a[aria-current="page"]::after{transform:scaleX(1)}
.header-actions{display:flex;align-items:center;gap:9px;flex-shrink:0}
.theme-toggle{border:0;background:transparent;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;padding:4px;cursor:pointer;transition:transform .22s}.theme-toggle:hover{transform:rotate(25deg) scale(1.08)}.theme-toggle:active{transform:scale(.92)}
.half-circle{width:30px;height:30px;display:block;border-radius:50%;background:linear-gradient(90deg,#fff 0 50%,#0b0b0b 50%);border:1.5px solid #c6c6c6;box-shadow:0 0 0 2px rgba(0,0,0,.12),0 3px 9px rgba(0,0,0,.22)}

.container{width:min(1140px,calc(100% - 40px));margin:0 auto;position:relative}

.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
h1,h2,h3,p{overflow-wrap:break-word}.hero h1{margin:26px 0 22px;font-size:clamp(39px,6.2vw,75px);line-height:1.18;letter-spacing:-.075em;font-weight:850}.gradient-word{background:linear-gradient(120deg,var(--text) 15%,var(--accent) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}.hero-desc{max-width:660px;margin:0;color:var(--muted);line-height:1.95;font-size:clamp(14px,1.6vw,16px)}
.actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:32px;flex-wrap:wrap}.btn{display:inline-flex;justify-content:center;align-items:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:11px;border:1px solid var(--stroke);background:var(--surface);color:var(--text);cursor:pointer;font-size:14px;font-weight:750;transition:transform .23s,box-shadow .23s,background .33s}.btn:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(0,0,0,.1)}.btn-primary{background:var(--button);border-color:var(--button);color:var(--button-text)}
.scroll-cue{margin-top:78px;display:flex;align-items:center;flex-direction:column;gap:9px;color:var(--soft);font-size:11px;letter-spacing:.08em}.scroll-cue svg{width:17px;height:17px;animation:scrollFloat 2.3s ease-in-out infinite}
.section{padding:108px 0;border-top:1px solid var(--stroke)}.section-compact{padding:82px 0}.section-title{font-size:clamp(27px,3.6vw,43px);font-weight:850;letter-spacing:-.058em;line-height:1.24;margin:13px 0 15px}.section-label{color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.17em}.section-desc{max-width:710px;font-size:15px;color:var(--muted);line-height:1.95;margin:0}.section-heading{text-align:center}.section-heading .section-desc{margin:0 auto}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-top:38px}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin-top:38px}.card{position:relative;padding:29px;border:1px solid var(--stroke);background:var(--surface);border-radius:18px;transition:background-color .34s,border-color .34s,transform .3s,box-shadow .3s;overflow:hidden}.card::before{content:"";pointer-events:none;position:absolute;top:-80px;left:-80px;width:160px;height:160px;background:radial-gradient(circle,var(--glow),transparent 70%);opacity:0;transition:opacity .3s}.card:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:var(--panel-shadow)}.card:hover::before{opacity:1}.card-icon{display:grid;place-items:center;width:47px;height:47px;border-radius:13px;background:var(--surface-2);border:1px solid var(--stroke);color:var(--accent)}.card-icon svg{width:23px;height:23px}.card h3{margin:24px 0 9px;font-size:17px;letter-spacing:-.025em}.card p{margin:0;color:var(--muted);line-height:1.8;font-size:13px}
.section-split{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.graphic-panel{border:1px solid var(--stroke);border-radius:22px;padding:28px;background:var(--surface);min-height:310px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--panel-shadow)}.graphic-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.status-chip{display:inline-flex;align-items:center;gap:7px;border-radius:100px;padding:8px 12px;border:1px solid var(--stroke);font-size:11px;font-weight:750;color:var(--muted)}.status-bars{display:grid;gap:12px}.status-bars>div{height:13px;border-radius:10px;background:var(--surface-2);overflow:hidden;border:1px solid var(--stroke)}.status-bars span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--accent-strong),var(--accent));transform-origin:left;animation:barGrow 1.2s ease-out both}.status-bars div:nth-child(1) span{width:82%}.status-bars div:nth-child(2) span{width:60%;animation-delay:.18s}.status-bars div:nth-child(3) span{width:91%;animation-delay:.3s}.graphic-bottom{font-size:11px;color:var(--soft)}
.plan-card{width:min(480px,100%);margin:42px auto 0;padding:34px;border-radius:22px;border:1px solid var(--accent);background:var(--surface);box-shadow:var(--panel-shadow);position:relative;transition:background-color .34s,transform .3s}.plan-card:hover{transform:translateY(-4px)}.badge{display:inline-flex;align-items:center;padding:7px 12px;border-radius:100px;border:1px solid var(--stroke);background:var(--surface-2);color:var(--text);font-size:11px;font-weight:800}.plan-card h3{font-size:27px;letter-spacing:-.04em;margin:22px 0 8px}.plan-price{font-weight:850;font-size:48px;letter-spacing:-.07em}.plan-price small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}.plan-sub{font-size:13px;color:var(--muted);line-height:1.8;margin-top:10px}.plan-features{list-style:none;padding:23px 0;margin:23px 0 20px;border-top:1px solid var(--stroke);display:grid;gap:17px}.plan-features li{display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5}.check{color:var(--accent);font-weight:900}.plan-card .btn{width:100%}.plan-footnote{font-size:12px;color:var(--soft);margin-top:17px;line-height:1.7;text-align:center}
.page-banner{text-align:center;padding:104px 0 95px}.page-banner h1{font-size:clamp(38px,5.5vw,64px);letter-spacing:-.075em;line-height:1.2;margin:20px 0}.page-banner p{color:var(--muted);font-size:15px;line-height:1.9;max-width:700px;margin:0 auto}.step-number{font-size:12px;color:var(--accent);letter-spacing:.13em;font-weight:850}.step-list{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:38px}.step{border-top:1px solid var(--stroke);padding:24px 10px 0 0}.step h3{font-size:16px;margin:15px 0 10px}.step p{font-size:13px;line-height:1.8;color:var(--muted);margin:0}.pill-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.pill{padding:10px 15px;border:1px solid var(--stroke);background:var(--surface);border-radius:30px;font-size:13px;color:var(--muted)}
.info-block{border:1px dashed var(--stroke);border-radius:20px;padding:40px;background:var(--surface);margin:35px 0 0;text-align:center}.info-block .card-icon{margin:0 auto}.info-block h3{margin:20px 0 10px;font-size:20px}.info-block p{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.9;max-width:580px}
.faq-list{display:grid;gap:10px;margin-top:36px}.faq-list details{border:1px solid var(--stroke);background:var(--surface);border-radius:13px;padding:0 21px;transition:background-color .34s}.faq-list summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:18px;align-items:center;padding:20px 0;font-size:14px;font-weight:750}.faq-list summary::-webkit-details-marker{display:none}.faq-list summary::after{content:'+';font-size:24px;color:var(--accent);font-weight:350}.faq-list details[open] summary::after{content:'−'}.faq-list p{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.85}
footer{border-top:1px solid var(--stroke);margin:30px auto 0;padding:26px 0 50px;display:flex;justify-content:space-between;gap:20px;align-items:center;color:var(--soft);font-size:12px}.footer-links{display:flex;gap:20px}.footer-links a:hover{color:var(--text)}
.dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.7);z-index:90;backdrop-filter:blur(5px)}.dialog-backdrop[hidden]{display:none}.dialog{width:min(420px,100%);padding:30px;background:var(--bar);border:1px solid var(--bar-border);border-radius:20px;box-shadow:0 25px 80px #0006;animation:pop .2s ease both}.dialog h2{margin:0 0 12px;font-size:21px}.dialog p{margin:0;line-height:1.8;font-size:14px;color:var(--muted)}.dialog .btn{margin-top:25px;min-height:42px}
/* Every section/card reveals on entry, without hiding content if JS is disabled. */
.js .reveal{opacity:0;transform:translateY(37px) scale(.99);filter:blur(3px);transition:opacity .8s cubic-bezier(.17,.67,.24,1),transform .8s cubic-bezier(.17,.67,.24,1),filter .8s ease;transition-delay:var(--delay,0ms)}.js .reveal.is-visible{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
.js .hero .reveal{transition-duration:1s}.page-enter{animation:pageIn .54s cubic-bezier(.2,.7,.2,1) both}.page-leaving{opacity:0;transform:translateY(11px);transition:opacity .19s ease,transform .19s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@keyframes scrollFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes barGrow{from{transform:scaleX(.03)}to{transform:scaleX(1)}}

@media(max-width:390px){.brand{font-size:13px}.brand-mark{width:28px;height:28px}.header-actions{gap:4px}.auth-button{padding:0 8px;font-size:12px;min-height:34px}.theme-toggle{width:34px;height:34px}.half-circle{width:26px;height:26px}.top-bar{padding:10px}.nav-links a{font-size:12px}.hero h1{font-size:38px}.card{padding:23px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.js .reveal{opacity:1;transform:none;filter:none}}

/* Display only the active page. */
main[hidden]{display:none!important}
main.page-active{animation:mainAppear .52s cubic-bezier(.2,.75,.2,1) both}
@keyframes mainAppear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
button:focus-visible,a:focus-visible{outline-offset:3px}

/* Auth experience */
.header-actions form{margin:0}
.auth-button{white-space:nowrap;text-decoration:none}
.auth-button.dark{background:var(--surface);}
.auth-shell{min-height:calc(100vh - 230px);display:grid;place-items:center;padding:72px 0 100px}
.auth-card{width:min(480px,100%);padding:clamp(25px,5vw,43px);background:var(--surface);border:1px solid var(--stroke);border-radius:22px;box-shadow:var(--panel-shadow)}
.auth-kicker{display:flex;align-items:center;gap:8px;color:var(--accent);letter-spacing:.15em;font-size:11px;font-weight:800}
.auth-card h1{font-size:clamp(27px,4vw,34px);margin:17px 0 10px;letter-spacing:-.06em}
.auth-description{margin:0 0 29px;font-size:14px;line-height:1.8;color:var(--muted)}
.auth-form{display:grid;gap:17px}.input-group{display:grid;gap:8px}
.input-group label{font-size:13px;font-weight:730}.input-group input{appearance:none;width:100%;min-height:47px;background:var(--surface-2);border:1px solid var(--stroke);padding:12px 14px;border-radius:10px;color:var(--text);font-size:15px;outline:0;transition:border-color .2s,box-shadow .2s}
.input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}.input-group input::placeholder{color:var(--soft)}
.input-group small{color:var(--soft);font-size:12px;line-height:1.6}
.auth-submit{width:100%;margin-top:10px}.auth-switch{border-top:1px solid var(--stroke);margin-top:24px;padding-top:20px;text-align:center;font-size:13px;color:var(--muted)}
.auth-switch a{font-weight:760;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.auth-alert{padding:12px 14px;border-radius:10px;border:1px solid #d06969;background:rgba(190,61,61,.09);margin:0 0 20px;font-size:13px;line-height:1.7;color:var(--text)}
.account-info{display:grid;gap:0;margin:20px 0 24px}.account-info>div{padding:16px 0;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.account-info dt{color:var(--muted);font-size:13px}.account-info dd{margin:0;font-weight:750;font-size:14px;overflow-wrap:anywhere}
.auth-note{color:var(--muted);font-size:12px;line-height:1.75;margin:16px 0 0}
@media(max-width:740px){.auth-shell{padding:45px 0 75px;min-height:calc(100vh - 200px)}.top-bar .header-actions{gap:4px}.top-bar .header-actions form .auth-button{padding:0 9px;font-size:11px}}


.plan-unselected{color:var(--muted);font-size:14px;font-weight:650}.plan-action form{margin:0}.plan-action .btn{width:100%}.plan-choice-hint{margin:16px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.account-plan-cta{margin:12px 0 26px}.account-plan-cta .btn{width:100%}
.support-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.support-category-card{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin:0}
.support-category-card h3{margin:0;font-size:21px}
.support-category-card p{flex:1}
.support-category-card .btn{margin-top:12px}
.support-small{font-size:12px;color:var(--muted)}
@media(max-width:680px){.support-grid{grid-template-columns:1fr}}

.support-layout{width:min(880px,100%);margin:25px auto 85px}
.support-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.support-panel{border:1px solid var(--stroke);border-radius:20px;background:var(--surface);overflow:hidden;padding:26px}
.support-panel h2{font-size:23px;margin:0 0 12px}.support-muted{color:var(--muted);font-size:13px}
.ticket-item{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--stroke);border-radius:12px;padding:17px;margin-top:14px;transition:border-color .2s,transform .2s}
.ticket-item:hover{border-color:var(--accent);transform:translateY(-2px)}.ticket-status{flex-shrink:0;color:var(--accent);font-size:12px}

.chat-meta{font-size:11px;color:var(--muted);margin-bottom:8px}.chat-text{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}

/* v16: Discord-style live typing feedback */
.typing-indicator{display:flex;align-items:center;gap:10px;min-height:32px;font-size:13px;color:var(--muted);padding:4px 0 10px;}
.typing-indicator[hidden]{display:none}

.typing-dots i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:typing-wave 1.15s infinite ease-in-out}

<div class="dialog-backdrop" hidden="" id="dialog-backdrop"><div aria-describedby="dialog-message" aria-labelledby="dialog-title" aria-modal="true" class="dialog" role="dialog"><h2 id="dialog-title">안내</h2><p id="dialog-message">자세한 내용을 확인해 주세요.</p><button class="btn btn-primary" id="dialog-close" type="button">확인</button></div></div>
{{SUPPORT_SCRIPT}}
<script>
(() => {
  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const meta = document.querySelector('meta[name="theme-color"]');
  const key = 'discord-store-theme';
  const getTheme = () => { try { return localStorage.getItem(key); } catch (_) { return null; } };
  function applyTheme(value) {
    const theme = value === 'gray' ? 'gray' : 'black';
    root.dataset.theme = theme;
    toggle?.setAttribute('aria-label', theme === 'black' ? '회색 테마로 전환' : '검정색 테마로 전환');
    toggle?.setAttribute('title', theme === 'black' ? '회색 테마로 전환' : '검정색 테마로 전환');
    meta?.setAttribute('content', theme === 'black' ? '#08090b' : '#a0a0a0');
    try { localStorage.setItem(key, theme); } catch (_) {}
  }
  applyTheme(getTheme() || 'black');
  toggle?.addEventListener('click', () => applyTheme(root.dataset.theme === 'black' ? 'gray' : 'black'));

  const dialog = document.getElementById('dialog-backdrop');
  const title = document.getElementById('dialog-title');
  const message = document.getElementById('dialog-message');
  const close = document.getElementById('dialog-close');
  let previouslyFocused = null;
  function openDialog(t, m) {
    previouslyFocused = document.activeElement;
    title.textContent = t;
    message.textContent = m;
    dialog.hidden = false;
    close.focus();
  }
  function closeDialog() {
    dialog.hidden = true;
    previouslyFocused?.focus?.();
  }
  document.querySelectorAll('[data-auth]').forEach(el => el.addEventListener('click', () => {
    openDialog(el.dataset.auth + ' 안내', '상단의 가입 또는 로그인 메뉴를 이용해 주세요.');
  }));
  document.querySelectorAll('[data-notice]').forEach(el => el.addEventListener('click', () => {
    openDialog('안내', el.dataset.notice);
  }));
  close?.addEventListener('click', closeDialog);
  dialog?.addEventListener('click', e => { if (e.target === dialog) closeDialog(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && dialog && !dialog.hidden) closeDialog();
    if (e.key === 'Tab' && dialog && !dialog.hidden) { e.preventDefault(); close.focus(); }
  });

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reveals = document.querySelectorAll('.reveal');
  if (reduced || !('IntersectionObserver' in window)) {
    reveals.forEach(el => el.classList.add('is-visible'));
  } else {
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) { entry.target.classList.add('is-visible'); obs.unobserve(entry.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -18px 0px' });
    reveals.forEach(el => observer.observe(el));
  }

  // All main navigation links load distinct HTML pages, not same-page anchors.
  document.querySelectorAll('a[data-page-link]').forEach(link => {
    link.addEventListener('click', e => {
      if (reduced || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0 || link.target === '_blank') return;
      const url = new URL(link.href, location.href);
      if (url.origin !== location.origin || url.pathname === location.pathname) return;
      e.preventDefault();
      document.querySelector('.site-shell')?.classList.add('page-leaving');
      setTimeout(() => { location.href = link.href; }, 180);
    });
  });
})();

</script></body></html>
